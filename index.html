<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TrackDayIQ</title>
  <meta name="description" content="Track-day telemetry that runs on your phone." />
  <style>
    :root { --bg: #0B1218; --text: #eef3f7; --muted: #a9b6c2; --accent: #3fb8f0; }
    @media (prefers-color-scheme: light) { :root { --bg: #f6f8fa; --text: #0f1720; --muted: #3d4a56; --accent: #0a76b0; } }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 400 17px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
    h1 { font-size: 30px; margin: 0 0 8px; }
    p { color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <h1>TrackDayIQ</h1>
  <p>Track-day telemetry that runs entirely on your phone: laps, corners and where the time went,
    from your data logger or from the phone's own GPS. Nothing is uploaded.</p>
  <p><a href="privacy.html">Privacy Policy</a></p>
</main>
</body>
</html>
